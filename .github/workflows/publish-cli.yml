name: Publish CLI to npm

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish-cli
  cancel-in-progress: false

jobs:
  publish-cli:
    name: Publish @airlink/cli to npm Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        run: npm install -g pnpm@9.7.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Protocol & Standalone CLI
        run: |
          pnpm --filter @airlink/protocol build
          pnpm --filter @airlink/cli build

      - name: Run CLI Tests
        run: pnpm --filter @airlink/cli test

      - name: Publish @airlink/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --filter @airlink/cli publish --access public --no-git-checks
